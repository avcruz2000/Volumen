name: Actualizar dashboard

on:
  schedule:
    - cron: "*/10 * * * *" # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generar snapshot de mercados
        run: npm run snapshot
        env:
          PUBLISHED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Historial de flujos (se recalcula una vez al día)
        run: npm run history
        env:
          PUBLISHED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          HISTORY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
